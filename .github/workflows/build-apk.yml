name: Build Pocket IDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Release Custom APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Online Debug APK
        run: |
          ./gradlew :app:assembleOnlineDebug -x lint --stacktrace 2>&1 | tee /tmp/build.log || {
            echo "::error::Build failed! Last 50 lines of log:"
            tail -n 50 /tmp/build.log
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-IDE-Debug-APK
          path: app/build/outputs/apk/online/debug/*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/online/debug/*.apk | head -n 1)
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | awk '{print $NF}' | tr -d '\r\n')
          TAG="v${VERSION_NAME:-1.0.24}"
          APK_NAME="Pocket-IDE-${TAG}.apk"
          echo "Publishing release $TAG with $APK_NAME from $APK_FILE"
          cp "$APK_FILE" "$APK_NAME"

          cat << EOF > release_notes.md
          ### Pocket IDE ${TAG}
          <!-- versionCode: ${VERSION_CODE} -->

          **Minimal, Premium UI/UX Polish, Design System Alignment, and Accessibility Floor.**

          #### What's New:
          - **Human-Crafted Engineering Standards**: Clean developer obsidian palette (\`#141414\`), crisp rectangular button radii (6dp/8dp), zero purple gradients, zero emojis, and zero em dashes.
          - **Legal & Transparency**: Integrated Terms & Conditions (\`TERMS.md\`) and Privacy Policy screens directly into app settings and dedicated web documentation.
          - **Custom Domain & Favicon**: Added official deployment assets (\`site/\`) with \`CNAME\` for \`pocketide.dev\`, favicon, and standalone legal pages.
          - **Minimal Splash Screen**: Clean, distraction-free startup sequence with solid obsidian background and primary blue loading indicator.
          - **Tactile Non-Bouncy Interaction**: Replaced bouncy spring physics with precise, tactile non-bouncing feedback.
          EOF

          gh release create "$TAG" "$APK_NAME" \
            --title "Pocket IDE $TAG: Development environment for Android" \
            --notes-file release_notes.md || (
            gh release edit "$TAG" --title "Pocket IDE $TAG: Development environment for Android" --notes-file release_notes.md || true
            gh release upload "$TAG" "$APK_NAME" --clobber
          )
