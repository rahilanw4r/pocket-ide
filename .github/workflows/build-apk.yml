name: Build Pocket IDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Release Custom APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Online Debug APK
        run: ./gradlew :app:assembleOnlineDebug -x lint --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-IDE-Debug-APK
          path: app/build/outputs/apk/online/debug/*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/online/debug/*.apk | head -n 1)
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | awk '{print $NF}' | tr -d '\r\n')
          TAG="v${VERSION_NAME:-1.0.24}"
          APK_NAME="Pocket-IDE-${TAG}.apk"
          echo "Publishing release $TAG with $APK_NAME from $APK_FILE"
          cp "$APK_FILE" "$APK_NAME"

          cat << EOF > release_notes.md
          ### Pocket IDE ${TAG}
          <!-- versionCode: ${VERSION_CODE} -->

          **Impeccable UI/UX Refinement, Mobile Developer Keyboard Strip, and Pinned Code Editor Line Numbers.**

          #### What's New:
          - **Reimagined Home Screen**: Interactive "What do you want to build?" fast launcher with instant starter template chips (React + Vite, Python, Android Compose, REST API) and a 4-tile quick action grid.
          - **Pinned Line Numbers in Code Editor**: Fixed horizontal scrolling in the code editor — line numbers remain permanently pinned in a dedicated left gutter while code scrolls horizontally.
          - **Mobile Developer Symbol Strip**: On-screen keyboard symbol row directly inside the code editor (\`{ } ( ) [ ] ; = " ' < > / \ : _ - + * $ & | ! TAB\`) for rapid typing without switching keyboard pages.
          - **Dynamic Theming & Contrast Fix**: Removed hardcoded dark palette leaks across all screens to ensure seamless light and dark mode adaptation.
          - **Floating Navigation Dock**: Upgraded both root and workspace docks to sleek, elevated floating bars with larger icons, smooth active state pills, and status badges.
          - **Two-Line Command Center**: Enhanced the Command Center (⌘) dialog with descriptive subtitles and clear action classifications.
          EOF

          gh release create "$TAG" "$APK_NAME" \
            --title "Pocket IDE $TAG — Your AI-powered development workspace, anywhere" \
            --notes-file release_notes.md || (
            gh release edit "$TAG" --title "Pocket IDE $TAG — Your AI-powered development workspace, anywhere" --notes-file release_notes.md && \
            gh release upload "$TAG" "$APK_NAME" --clobber
          )
